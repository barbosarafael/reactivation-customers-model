project:
  name: reactivation_customers_model
  environment: dev
  random_seed: 42
  timezone: America/Sao_Paulo

data:
  source:
    name: online_retail_ii
    provider: uci_machine_learning_repository
    url: https://archive.ics.uci.edu/dataset/502/online+retail+ii

databricks:
  catalog: workspace
  # Schema padrão para helpers sem camada explícita.
  schema: gold_layer

# Contrato confirmado no Workspace em 2026-08-04. As tabelas operacionais são
# distribuídas por schemas de camada, e não por um único schema de projeto.
schemas:
  bronze: bronze_layer
  silver: silver_layer
  gold: gold_layer
  synthetic: synthetic_layer
  monitoring: monitoring_layer
  explainability: explainability_layer

tables:
  bronze:
    online_retail_i: online_retail_i
    online_retail_ii: online_retail_ii

  silver:
    transactions: online_retail_transactions

  gold:
    modeling: customer_reactivation_modeling
    feature_snapshot: customer_reactivation_feature_snapshot
    reactivation_scores: customer_reactivation_scoring

  synthetic:
    transactions: online_retail_transactions
    generation_runs: generation_runs
    full_history: online_retail_transactions_full

  monitoring:
    summary: model_monitoring_summary
    feature_monitoring: feature_monitoring
    performance: performance_monitoring

  explainability:
    global_feature_importance: global_feature_importance
    local_feature_contributions: local_feature_contributions

modeling:
  customer_id_col: customer_id
  reference_date_col: reference_date
  target_col: target_reactivated_30d

  inactive_days_threshold: 60
  observation_window_days: 180
  prediction_window_days: 30

  split:
    strategy: temporal
    train_ratio: 0.70
    validation_ratio: 0.15
    test_ratio: 0.15

metrics:
  technical:
    - roc_auc
    - pr_auc
    - precision
    - recall
    - f1

  business:
    - precision_at_top_10
    - precision_at_top_20
    - lift_at_top_10
    - lift_at_top_20

mlflow:
  experiment_name: /Shared/bettor_crm_ml/dev/reactivation_30d
  registered_model_name: workspace.default.reactivation_customers_model
  model_alias: champion
