name: Databricks Bundle CI/CD

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "databricks.yml"
      - "resources/**"
      - "notebooks/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/databricks-bundle.yml"

  push:
    branches:
      - dev
    paths:
      - "databricks.yml"
      - "resources/**"
      - "notebooks/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/databricks-bundle.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  validate:
    name: Validate Databricks Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Show Databricks CLI version
        run: databricks version

      - name: Validate dev bundle
        run: databricks bundle validate --target dev

  deploy-dev:
    name: Deploy Databricks Bundle to dev
    runs-on: ubuntu-latest

    needs:
      - validate

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy dev bundle
        run: databricks bundle deploy --target dev